<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>傾偈 King Gai｜友達と話せる広東語</title>
  <meta name="description" content="日本語話者向け、香港の友達とのラフな会話・チャット・スラングに特化した広東語発音練習アプリ。声調判定つき。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+HK:wght@500;700&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <header class="top">
    <h1>傾偈 <span>King Gai</span></h1>
    <div class="top-actions">
      <button id="btn-add" class="ghost add">＋ 単語追加</button>
      <button id="btn-tones" class="ghost">6声調</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main>
    <section class="card" id="card">
      <div class="empty" id="empty" hidden>
        <p>まだマイ単語がありません。<br>友達に教わった言葉を追加しよう！</p>
        <button id="empty-add" class="primary">＋ 今日の単語を追加</button>
      </div>
      <div id="card-body">
      <div class="card-actions" id="card-actions" hidden>
        <button id="btn-edit" class="ghost">✏️ 編集</button>
        <button id="btn-del" class="ghost">🗑 削除</button>
      </div>
      <div class="counter" id="counter"></div>
      <div class="tag-row" id="tag-row">
        <button type="button" id="tag-freq" class="tag-btn freq">🔥 頻出</button>
        <button type="button" id="tag-slang" class="tag-btn slang">🤬 スラング</button>
      </div>
      <div class="hanzi" id="hanzi"></div>
      <div class="jyut" id="jyut"></div>
      <div class="jp" id="jp"></div>
      <p class="scene" id="scene"></p>

      <div class="graph-wrap">
        <canvas id="graph" width="600" height="180"></canvas>
        <div class="legend"><span class="lg-exp">お手本</span><span class="lg-you">あなた</span></div>
      </div>

      <div class="result" id="result" hidden>
        <div class="score-ring"><svg viewBox="0 0 36 36"><path class="bg" d="M18 2a16 16 0 1 1 0 32a16 16 0 1 1 0-32"/><path id="ring" class="fg" stroke-dasharray="0,100" d="M18 2a16 16 0 1 1 0 32a16 16 0 1 1 0-32"/></svg><b id="score">0</b></div>
        <div class="result-detail">
          <div id="verdict"></div>
          <small id="heard"></small>
          <small id="sub"></small>
        </div>
      </div>

      <details class="tip" open>
        <summary>💡 発音のコツ</summary>
        <p id="tip"></p>
      </details>

      <div class="zh-box" id="zh-box">
        <span class="zh-label">普通話</span>
        <span class="zh-text"><b id="zh"></b><small id="zh-kana"></small></span>
        <button id="btn-zh-play" class="zh-btn" aria-label="普通話を再生">▶</button>
        <button id="btn-zh-rec" class="zh-btn rec" aria-label="普通話で採点">🎤</button>
      </div>
      </div>
    </section>
  </main>

  <footer class="controls">
    <button id="btn-prev" class="nav" aria-label="前へ">‹</button>
    <button id="btn-slow" class="small" aria-label="スロー再生">🐢</button>
    <button id="btn-play" class="big play" aria-label="再生">▶</button>
    <button id="btn-rec" class="big rec" aria-label="録音">🎤</button>
    <button id="btn-next" class="nav" aria-label="次へ">›</button>
  </footer>

  <dialog id="tone-dialog">
    <h2>広東語の6声調</h2>
    <p class="muted">日本語は「高・低」の2段階。広東語は5段階の高さで6種類を区別します。</p>
    <div id="tone-grid" class="tone-grid"></div>
    <ul class="muted pitfalls">
      <li>3声と6声の差は小さい：6声は「ぼそっと」低く。</li>
      <li>2声と5声：2声は高く跳ね上がる、5声は少しだけ上がる。</li>
      <li>-p/-t/-k は音を出さず口の形で止める。</li>
    </ul>
    <button id="close-dialog" class="ghost">閉じる</button>
  </dialog>

  <dialog id="add-dialog">
    <form id="add-form" class="add-form">
      <h2 id="form-title">今日の単語を追加</h2>
      <label>広東語（漢字など）<b>*</b>
        <input id="f-hanzi" required placeholder="例：你好叻咁　/　好chill" autocomplete="off" />
      </label>
      <label>粤拼（わかればでOK・空欄で大丈夫）
        <input id="f-jyut" placeholder="例：nei5 hou2 gwai2 gam2" autocomplete="off" autocapitalize="off" />
        <small class="muted">お手本を録音すれば、粤拼なしでも友達の声と比べて採点できます</small>
      </label>
      <label>意味
        <input id="f-jp" placeholder="例：めっちゃいい人だね" autocomplete="off" />
      </label>
      <label>使う場面
        <input id="f-scene" placeholder="例：友達を褒めるとき" autocomplete="off" />
      </label>
      <label>普通話（任意）
        <input id="f-zh" placeholder="例：你人真好" autocomplete="off" />
      </label>
      <label>普通話の発音カナ（任意）
        <input id="f-zhkana" placeholder="例：ニー レン ジェンハオ" autocomplete="off" />
      </label>
      <div class="tag-pick">
        <label><input type="checkbox" id="f-tag-freq" /> 🔥 頻出</label>
        <label><input type="checkbox" id="f-tag-slang" /> 🤬 スラング</label>
      </div>
      <label>発音メモ
        <textarea id="f-tip" rows="2" placeholder="例：gwai2 は上げる。友達は早口だった"></textarea>
      </label>
      <div class="rec-box">
        <button type="button" id="f-rec" class="ghost">🎙 お手本を録音</button>
        <button type="button" id="f-rec-play" class="ghost" hidden>▶</button>
        <button type="button" id="f-rec-del" class="ghost" hidden>✕</button>
        <small id="f-rec-status" class="muted"></small>
        <small class="muted full">友達にその場で言ってもらうと、その声がお手本になります（最長5秒）</small>
      </div>
      <div class="form-btns">
        <button type="button" id="f-cancel" class="ghost">キャンセル</button>
        <button type="submit" id="f-save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
